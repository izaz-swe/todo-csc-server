services:
  # 1. Reverse Proxy Gateway (Single Public Access Point)
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: todo_proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  # 2. Frontend SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app_net

  # 3. Backend API Service (Node.js Alpine - No PM2 needed)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - app_net

  # 4. Cloudflare Tunnel (Secure Public Ingress)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: todo_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_net
    depends_on:
      - proxy

networks:
  app_net:
    driver: bridge
